name: aiact-rag

services:
  qdrant:
    image: qdrant/qdrant:v1.19.2
    restart: unless-stopped
    ports: ["6333:6333"]
    volumes: ["qdrant_data:/qdrant/storage"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: chunk + embed + index the serving collection (idempotent; skips existing collections).
  # The eval service indexes the other strategies on demand.
  ingest:
    build: .
    command: ["aiact", "ingest", "--strategies", "structural", "--skip-existing"]
    healthcheck: { disable: true }
    environment:
      QDRANT_URL: http://qdrant:6333
    depends_on:
      qdrant: { condition: service_healthy }
    restart: "no"

  api:
    build: .
    restart: unless-stopped
    ports: ["8000:8000"]
    env_file:
      - path: .env
        required: false
    environment:
      QDRANT_URL: http://qdrant:6333
    volumes:
      - llm_cache:/app/data/cache
    depends_on:
      qdrant: { condition: service_healthy }
      ingest: { condition: service_completed_successfully }

  # Evaluation runs on demand:  docker compose run --rm eval eval retrieval
  eval:
    build: .
    profiles: ["eval"]
    healthcheck: { disable: true }
    entrypoint: ["aiact"]
    command: ["eval", "retrieval"]
    env_file:
      - path: .env
        required: false
    environment:
      QDRANT_URL: http://qdrant:6333
    volumes:
      - ./results:/app/results
      - llm_cache:/app/data/cache
    depends_on:
      qdrant: { condition: service_healthy }

volumes:
  qdrant_data:
  llm_cache:
