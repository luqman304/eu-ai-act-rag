[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "aiact-rag"
version = "1.0.0"
description = "Grounded Q&A over the EU AI Act (Regulation (EU) 2024/1689) with a retrieval + generation evaluation harness."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "anthropic>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "qdrant-client>=1.12",
    "fastembed>=0.5",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "httpx>=0.27",
    "typer>=0.12",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
aiact = "aiact_rag.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/aiact_rag"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008", "E501"]  # line length is owned by `ruff format`

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
